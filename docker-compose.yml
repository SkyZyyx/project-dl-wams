services:
  postgres_main:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB:-postgres_main}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_MAIN_DB:-postgres_main}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_USERS_DB:-postgres_users}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_USERS_DB:-postgres_users}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_products:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_PRODUCTS_DB:-postgres_products}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
    volumes:
      - postgres_products_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_PRODUCTS_DB:-postgres_products}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_orders:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_ORDERS_DB:-postgres_orders}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
    volumes:
      - postgres_orders_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_ORDERS_DB:-postgres_orders}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_search:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_SEARCH_DB:-postgres_search}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
    volumes:
      - postgres_search_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wams} -d ${POSTGRES_SEARCH_DB:-postgres_search}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.5
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  main_service:
    build:
      context: ./main_service
    command: sh -c "until python -c 'import os,socket; s=socket.socket(); s.settimeout(1); s.connect((os.getenv(\"POSTGRES_HOST\", \"postgres_main\"), int(os.getenv(\"POSTGRES_PORT\", \"5432\")))); s.close()'; do echo waiting for postgres_main; sleep 2; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SECRET_KEY: ${MAIN_DJANGO_SECRET_KEY:-dev-main-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,mainservice,nginx,userservice,productservice,orderservice,searchservice}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-key}
      POSTGRES_DB: ${POSTGRES_MAIN_DB:-postgres_main}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
      POSTGRES_HOST: postgres_main
      POSTGRES_PORT: 5432
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://productservice:8002}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-http://orderservice:8003}
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://userservice:8001}
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-http://searchservice:8004}
      SEARCH_SERVICE_TIMEOUT_SECONDS: ${SEARCH_SERVICE_TIMEOUT_SECONDS:-10}
      UPSTREAM_TIMEOUT_SECONDS: ${UPSTREAM_TIMEOUT_SECONDS:-10}
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media/
    volumes:
      - ./main_service:/app
      - media_data:/app/media:ro
    networks:
      default:
        aliases:
          - mainservice
    depends_on:
      postgres_main:
        condition: service_healthy
    ports:
      - "8000:8000"

  user_service:
    build:
      context: ./user_service
    command: sh -c "until python -c 'import os,socket; s=socket.socket(); s.settimeout(1); s.connect((os.getenv(\"POSTGRES_HOST\", \"postgres_users\"), int(os.getenv(\"POSTGRES_PORT\", \"5432\")))); s.close()'; do echo waiting for postgres_users; sleep 2; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8001"
    environment:
      DJANGO_SECRET_KEY: ${USER_DJANGO_SECRET_KEY:-dev-user-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,userservice,nginx}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-key}
      POSTGRES_DB: ${POSTGRES_USERS_DB:-postgres_users}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
      POSTGRES_HOST: postgres_users
      POSTGRES_PORT: 5432
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media/
    volumes:
      - ./user_service:/app
    networks:
      default:
        aliases:
          - userservice
    depends_on:
      postgres_users:
        condition: service_healthy
    ports:
      - "8001:8001"

  product_service:
    build:
      context: ./product_service
    command: sh -c "until python -c 'import os,socket; s=socket.socket(); s.settimeout(1); s.connect((os.getenv(\"POSTGRES_HOST\", \"postgres_products\"), int(os.getenv(\"POSTGRES_PORT\", \"5432\")))); s.close()'; do echo waiting for postgres_products; sleep 2; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    environment:
      DJANGO_SECRET_KEY: ${PRODUCT_DJANGO_SECRET_KEY:-dev-product-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,productservice,nginx}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-key}
      POSTGRES_DB: ${POSTGRES_PRODUCTS_DB:-postgres_products}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
      POSTGRES_HOST: postgres_products
      POSTGRES_PORT: 5432
      SEARCH_SERVICE_URL: ${SEARCH_SERVICE_URL:-http://searchservice:8004}
      SEARCH_SERVICE_HOST_HEADER: ${SEARCH_SERVICE_HOST_HEADER:-localhost}
      SEARCH_SERVICE_TIMEOUT_SECONDS: ${SEARCH_SERVICE_TIMEOUT_SECONDS:-180}
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media/
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_API_TOKEN: ${KAGGLE_API_TOKEN:-}
    volumes:
      - ./product_service:/app
      - media_data:/app/media
    networks:
      default:
        aliases:
          - productservice
    depends_on:
      postgres_products:
        condition: service_healthy
    ports:
      - "8002:8002"

  order_service:
    build:
      context: ./order_service
    command: sh -c "until python -c 'import os,socket; s=socket.socket(); s.settimeout(1); s.connect((os.getenv(\"POSTGRES_HOST\", \"postgres_orders\"), int(os.getenv(\"POSTGRES_PORT\", \"5432\")))); s.close()'; do echo waiting for postgres_orders; sleep 2; done; python manage.py migrate && python manage.py runserver 0.0.0.0:8003"
    environment:
      DJANGO_SECRET_KEY: ${ORDER_DJANGO_SECRET_KEY:-dev-order-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,orderservice,nginx}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-shared-jwt-key}
      POSTGRES_DB: ${POSTGRES_ORDERS_DB:-postgres_orders}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
      POSTGRES_HOST: postgres_orders
      POSTGRES_PORT: 5432
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:-http://productservice:8002}
      PRODUCT_SERVICE_TIMEOUT_SECONDS: ${PRODUCT_SERVICE_TIMEOUT_SECONDS:-10}
    volumes:
      - ./order_service:/app
    networks:
      default:
        aliases:
          - orderservice
    depends_on:
      postgres_orders:
        condition: service_healthy
    ports:
      - "8003:8003"

  search_service:
    build:
      context: ./search_service
    command: sh -c "until python -c 'import os,socket; s=socket.socket(); s.settimeout(1); s.connect((os.getenv(\"POSTGRES_HOST\", \"postgres_search\"), int(os.getenv(\"POSTGRES_PORT\", \"5432\")))); s.close()'; do echo waiting for postgres_search; sleep 2; done; python manage.py migrate && exec gunicorn config.wsgi:application --bind 0.0.0.0:8004 --workers 1 --threads 4 --timeout 300"
    environment:
      DJANGO_SECRET_KEY: ${SEARCH_DJANGO_SECRET_KEY:-dev-search-secret}
      DJANGO_DEBUG: ${SEARCH_DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,searchservice,nginx}
      POSTGRES_DB: ${POSTGRES_SEARCH_DB:-postgres_search}
      POSTGRES_USER: ${POSTGRES_USER:-wams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wams}
      POSTGRES_HOST: postgres_search
      POSTGRES_PORT: 5432
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_HTTP_TIMEOUT: ${QDRANT_HTTP_TIMEOUT:-5}
      MAIN_SERVICE_URL: ${MAIN_SERVICE_URL:-http://mainservice:8000}
      DEFAULT_SEARCH_MODEL: ${DEFAULT_SEARCH_MODEL:-dinov2_base_triplet_finetuned}
      SEARCH_PREPROCESS_ENABLED: ${SEARCH_PREPROCESS_ENABLED:-1}
      SEARCH_PREPROCESS_USE_REMBG: ${SEARCH_PREPROCESS_USE_REMBG:-0}
      SEARCH_PREPROCESS_PAD: ${SEARCH_PREPROCESS_PAD:-12}
      SEARCH_PREPROCESS_THRESHOLD: ${SEARCH_PREPROCESS_THRESHOLD:-24}
      SEARCH_PREPROCESS_MIN_AREA_RATIO: ${SEARCH_PREPROCESS_MIN_AREA_RATIO:-0.01}
      SEARCH_MIN_SCORE_THRESHOLD: ${SEARCH_MIN_SCORE_THRESHOLD:-0.45}
      SEARCH_OOD_COSINE_THRESHOLD: ${SEARCH_OOD_COSINE_THRESHOLD:--1}
      SEARCH_OOD_TOP_SCORE_THRESHOLD: ${SEARCH_OOD_TOP_SCORE_THRESHOLD:-0}
      DINOV2_TRANSFER_CHECKPOINT_PATH: ${DINOV2_TRANSFER_CHECKPOINT_PATH:-}
      DINOV2_FINETUNED_CHECKPOINT_PATH: ${DINOV2_FINETUNED_CHECKPOINT_PATH:-}
      DINOV2_TRIPLET_FINETUNED_SOURCE: ${DINOV2_TRIPLET_FINETUNED_SOURCE:-vit_base_patch14_dinov2.lvd142m}
      DINOV2_TRIPLET_FINETUNED_CHECKPOINT_PATH: ${DINOV2_TRIPLET_FINETUNED_CHECKPOINT_PATH:-/model/retrieval_model.pth}
      DINOV2_TRIPLET_FINETUNED_VECTOR_SIZE: ${DINOV2_TRIPLET_FINETUNED_VECTOR_SIZE:-512}
      CLIP_VIT_B32_CHECKPOINT_PATH: ${CLIP_VIT_B32_CHECKPOINT_PATH:-}
      SEARCH_COLLECTION_SCROLL_LIMIT: ${SEARCH_COLLECTION_SCROLL_LIMIT:-256}
      MEDIA_ROOT: /app/media
      MEDIA_URL: /media/
    volumes:
      - ./search_service:/app
      - media_data:/app/media
      - ./model:/model
    networks:
      default:
        aliases:
          - searchservice
    depends_on:
      postgres_search:
        condition: service_healthy
      qdrant:
        condition: service_started
    ports:
      - "8004:8004"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - main_service
      - user_service
      - product_service
      - order_service
      - search_service
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/media:ro

volumes:
  postgres_main_data:
  postgres_users_data:
  postgres_products_data:
  postgres_orders_data:
  postgres_search_data:
  qdrant_data:
  media_data:
