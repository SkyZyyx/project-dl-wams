{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="A minimalist image-search storefront powered by main_service.">
    <title>{% block title %}WAMS{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'users/site.css' %}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="page-shell">
        <header class="site-topbar">
            <a class="brand" href="/" aria-label="WAMS home">
                <span class="brand-mark"></span>
                <span class="brand-copy">
                    <strong>WAMS</strong>
                    <span>visual commerce</span>
                </span>
            </a>
            <nav class="site-nav" aria-label="Main">
                <a href="/">Shop</a>
                <a href="/demo/">Lab</a>
                <a href="/auth/login/">Login</a>
                <a href="/auth/register/">Register</a>
                <a href="/auth/profile/">Profile</a>
            </nav>
        </header>

        <main class="site-main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <script>
        window.__wamsInit = function (callback) {
            if (window.WAMS) {
                callback(window.WAMS);
                return;
            }

            window.addEventListener("wams:ready", function () {
                callback(window.WAMS);
            }, { once: true });
        };
    </script>
    <script src="{% static 'users/site.js' %}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
